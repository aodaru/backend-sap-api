[project]
name = "backend-sap-automation"
version = "0.1.0"
description = "Backend API para automatizar transacciones SAP (ME12, VK12)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0,<1.0.0",
    "uvicorn[standard]>=0.24.0,<1.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "python-multipart>=0.0.6",
    "openpyxl>=3.1.0,<4.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "httpx>=0.25.0,<1.0.0",
]

# ============================================================
# Configuración de pytest
# ============================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: Tests unitarios (rápidos, sin dependencias externas)",
    "integration: Tests de integración (usan FastAPI TestClient)",
    "slow: Tests lentos (requieren más tiempo)",
]

# ============================================================
# Configuración de cobertura (pytest-cov)
# ============================================================

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "htmlcov/*",
    ".venv/*",
    "venv/*",
    "__pycache__/*",
    ".git/*",
    "logs/*",
    "templates/*",
    "progress/*",
    "specs/*",
    ".agents/*",
    ".opencode/*",
]

[tool.coverage.report]
# Umbral mínimo de cobertura global
fail_under = 70

# Mostrar líneas no cubiertas
show_missing = true

# Precisión de los porcentajes
precision = 2

# Ordenar por porcentaje de cobertura (menor primero)
sort = "Cover"

# Excluir líneas que no son testeables
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
    "except ImportError",
    "if TYPE_CHECKING:",
]

# Configuración para reporte HTML
[tool.coverage.html]
directory = "htmlcov"

# Configuración para reporte XML (para CI/CD)
[tool.coverage.xml]
output = "coverage.xml"
